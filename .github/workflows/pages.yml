# Deploys the site on every push. A custom workflow, not "deploy from a branch",
# because branch deploys have a soft limit of 10 builds an hour and we push every minute.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# queue, never cancel: cancelling a running Pages deployment orphans it and every deploy
# after that fails with "in progress deployment". GitHub keeps only the newest queued run.
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
